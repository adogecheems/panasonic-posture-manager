[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panasonic-posture-manager"
version = "3.0.2"
description = "Posture management and screen orientation for convertible 2-in-1 laptops on Windows 10/11 and GNOME/KDE Plasma 6 Wayland"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "adogecheems" }]
classifiers = [
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Desktop Environment :: Gnome",
  "Topic :: Desktop Environment :: KDE",
]
# PyGObject is provided by the distribution (python-gobject); it is intentionally
# not a pip dependency so package builds never try to compile it.
dependencies = []

[project.urls]
Homepage = "https://github.com/adogecheems/panasonic-posture-manager"
Repository = "https://github.com/adogecheems/panasonic-posture-manager"

[project.scripts]
panasonic-posture-manager = "panasonic_posture.linux.app.cli:launch_ui"
panasonic-posture-manager-probe = "panasonic_posture.linux.hardware.probe:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["panasonic_posture*"]

[tool.setuptools.package-data]
"panasonic_posture.linux.contracts.resources" = ["*.xml"]
