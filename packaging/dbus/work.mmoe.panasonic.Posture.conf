<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the privileged service name. -->
  <policy user="root">
    <allow own="work.mmoe.panasonic.Posture"/>
  </policy>

  <!-- Session adapters (unprivileged, one per logged-in user) own the
       per-uid well-known name work.mmoe.panasonic.Posture.Session.u<uid>
       on the system bus (the "u" prefix is required because D-Bus name
       elements must not start with a digit).  "own_prefix" allows the whole
       dot-separated subtree ...Posture.Session.* (but not unrelated names
       such as ...Posture.SessionExtra); both dbus-daemon and dbus-broker
       support this attribute.  The rule only grants the *ability to request*
       a name: the daemon independently validates SessionUpdate senders by
       checking the exact per-uid name of the caller's uid, that the uid has
       the active local graphical session, and that the sender process belongs
       to the user unit panasonic-posture-manager-session.service (cgroup). -->
  <policy context="default">
    <allow own_prefix="work.mmoe.panasonic.Posture.Session"/>
  </policy>

  <!-- Clients (UI, session adapter) may only talk to the documented service
       interface, plus the standard introspection helpers.  Every mutating
       method is additionally checked by the daemon (logind + polkit for
       user-initiated methods, session-adapter identity for SessionUpdate). -->
  <policy context="default">
    <allow send_destination="work.mmoe.panasonic.Posture"
           send_interface="work.mmoe.panasonic.Posture"/>
    <allow send_destination="work.mmoe.panasonic.Posture"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="work.mmoe.panasonic.Posture"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="work.mmoe.panasonic.Posture"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
