name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native and translation tooling
        run: sudo apt-get update && sudo apt-get install -y build-essential gettext
      - name: Build and check C relay
        run: make PYTHON=python check-c
      - name: Compile Python sources
        run: make PYTHON=python check-compile
      - name: Check translations and localized metadata
        run: make PYTHON=python check-i18n
      - name: Run platform-neutral and Linux-only unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest \
            tests.test_repository_layout \
            tests.test_platform_imports \
            tests.test_platform_boundaries \
            tests.test_platform_separation \
            tests.test_linux_platform_separation \
            tests.test_model \
            tests.test_policy \
            tests.test_controller \
            tests.test_presentation \
            tests.test_frontend \
            tests.test_localization \
            tests.test_i18n_check \
            tests.test_journal \
            tests.test_session_refresh \
            tests.test_linux_display_plasma \
            tests.test_linux_protocol \
            tests.test_linux_profile \
            tests.test_linux_settings \
            tests.test_linux_iio \
            tests.test_linux_sysfs \
            tests.test_linux_sensor -v

  linux-full:
    name: Full Linux checks (system Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # GI's native extensions must use the distribution's Python ABI.
      - name: Install native, desktop and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential dbus desktop-file-utils gettext \
            gir1.2-adw-1 gir1.2-gtk-4.0 libgtk-4-bin libxml2-utils \
            python3 python3-gi python3-gi-cairo
      - name: Verify desktop test prerequisites
        run: |
          command -v gtk4-broadwayd
          /usr/bin/python3 -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); from gi.repository import Gio, Gtk, Adw; import cairo"
      - name: Run complete unit, private desktop and D-Bus checks
        run: make WERROR=1 PYTHON=/usr/bin/python3 check
