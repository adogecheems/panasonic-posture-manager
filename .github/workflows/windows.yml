name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows/requirements-ui.txt
      - name: Install Windows UI dependencies
        run: python -m pip install -r packaging/windows/requirements-ui.txt
      - name: Check Windows hardware, frontend and Qt widgets
        run: |
          python -m compileall -q src/panasonic_posture/windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest tests.test_repository_layout tests.test_platform_imports tests.test_platform_boundaries tests.test_platform_separation -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_windows*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_session_refresh.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_frontend.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest tests.test_localization tests.test_i18n_check -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/check_i18n.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Stage third-party packages with licenses
        run: python -m pip install --no-compile --target build/windows-dependencies -r packaging/windows/requirements-ui.txt
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$tools;$env:PATH"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wix extension add -g WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build MSI
        run: |
          $version = python packaging/common/release_version.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python packaging/windows/build_msi.py --dependencies build/windows-dependencies --version $version --culture all
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify MSI administrative payload
        run: |
          $packages = @(Get-ChildItem dist/windows/*.msi)
          if ($packages.Count -ne 2) {
            throw "Expected two localized MSI packages, found $($packages.Count)."
          }
          foreach ($package in $packages) {
            $target = Join-Path $env:RUNNER_TEMP "posture-msi-admin-$($package.BaseName)"
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
              '/a', "`"$($package.FullName)`"", '/qn', "TARGETDIR=`"$target`""
            )
            if ($process.ExitCode -notin 0, 3010) { exit $process.ExitCode }
            $service = Get-ChildItem $target -Recurse -File -Filter daemon.py |
              Select-Object -First 1
            $runtime = Get-ChildItem $target -Recurse -File -Filter python-hardware.exe |
              Select-Object -First 1
            $catalog = Get-ChildItem $target -Recurse -File -Filter zh_CN.po |
              Select-Object -First 1
            if ($null -eq $service -or $null -eq $runtime -or $null -eq $catalog) {
              throw "MSI administrative payload is incomplete: $($package.Name)"
            }
            $uiPython = Join-Path $runtime.Directory.FullName 'python.exe'
            $uiProbe = & $uiPython -B -I -c "import qfluentwidgets, qframelesswindow, panasonic_posture.windows.ui.launcher" 2>&1
            if ($LASTEXITCODE) {
              throw "Windows UI dependency probe failed for $($package.Name): $uiProbe"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-python-3.13
          path: dist/windows/*.msi
          if-no-files-found: error
