name: Windows

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/windows/**'
      - 'data/assets/**'
      - 'po/**'
      - '.github/workflows/windows.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install Windows UI dependencies
        run: python -m pip install -r packaging/windows/requirements-ui.txt
      - name: Check Windows hardware, frontend and Qt widgets
        run: |
          python -m compileall -q src/panasonic_posture/windows src/panasonic_posture/fluent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_windows*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_session_refresh.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_optional_input.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_frontend.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_fluent.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/check_i18n.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Stage third-party packages with licenses
        run: python -m pip install --target build/windows-dependencies -r packaging/windows/requirements-ui.txt
      - name: Install WiX
        if: matrix.python == '3.13'
        run: |
          dotnet tool install --global wix --version 5.0.2
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$tools;$env:PATH"
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Build portable application
        run: python packaging/windows/build.py --dependencies build/windows-dependencies
      - name: Build MSI
        if: matrix.python == '3.13'
        run: |
          $version = python packaging/scripts/release_version.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python packaging/windows/build_msi.py --dependencies build/windows-dependencies --version $version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify extracted bundle with its own Python
        run: |
          Expand-Archive dist/windows/panasonic-posture-windows-portable.zip -DestinationPath build/unpacked
          Remove-Item Env:PYTHONPATH
          $env:POSTURE_BUNDLE = (Resolve-Path build/unpacked/PanasonicPostureManager).Path
          python tests/windows_bundle_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify MSI administrative payload
        if: matrix.python == '3.13'
        run: |
          $package = Get-Item dist/windows/*.msi | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'posture-msi-admin'
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/a', "`"$($package.FullName)`"", '/qn', "TARGETDIR=`"$target`""
          )
          if ($process.ExitCode -notin 0, 3010) { exit $process.ExitCode }
          $service = Get-ChildItem $target -Recurse -File -Filter hardware_service.py |
            Select-Object -First 1
          $runtime = Get-ChildItem $target -Recurse -File -Filter python-hardware.exe |
            Select-Object -First 1
          if ($null -eq $service -or $null -eq $runtime) {
            throw 'MSI administrative payload is incomplete.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-python-${{ matrix.python }}
          path: dist/windows/*
          if-no-files-found: error
