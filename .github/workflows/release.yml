name: Release packages

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag containing this workflow to rebuild (for example v2.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package-arch:
    name: Arch package and AUR metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build, check and package
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e RELEASE_TAG \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                dbus desktop-file-utils gcc gettext gjs git gtk4 iio-sensor-proxy \
                libadwaita libarchive libxml2 make polkit python python-build \
                python-gobject python-installer python-setuptools python-wheel systemd
              python3 packaging/scripts/release_version.py --tag "$RELEASE_TAG"
              make WERROR=1 check

              useradd -m builder
              rm -rf /tmp/ppm-arch
              cp -a /work /tmp/ppm-arch
              chown -R builder:builder /tmp/ppm-arch
              su builder -c "cd /tmp/ppm-arch && makepkg --cleanbuild --noconfirm --nodeps"

              install -d /work/dist/release /work/dist/aur
              install -m644 /tmp/ppm-arch/packaging/aur/panasonic-posture-manager-*.pkg.tar.zst \
                /work/dist/release/
              su builder -c "cd /tmp/ppm-arch/packaging/aur && makepkg --printsrcinfo" \
                >/work/dist/aur/SRCINFO
              install -m644 /tmp/ppm-arch/packaging/aur/PKGBUILD /work/dist/aur/PKGBUILD
              install -m644 /tmp/ppm-arch/packaging/aur/panasonic-posture-manager.install \
                /work/dist/aur/panasonic-posture-manager.install

              package=$(find /work/dist/release -name "*.pkg.tar.zst" -print -quit)
              make check-package PACKAGE="$package"
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/release/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Upload AUR metadata
        uses: actions/upload-artifact@v4
        with:
          name: aur-metadata
          path: dist/aur
          if-no-files-found: error
          retention-days: 7

  package-deb:
    name: Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build and inspect .deb
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e RELEASE_TAG \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:24.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                dpkg-dev gcc gettext gzip libc6-dev make python3 python3-build \
                python3-installer python3-setuptools python3-venv python3-wheel
              python3 packaging/scripts/release_version.py --tag "$RELEASE_TAG"
              bash packaging/scripts/build-deb.sh /work/dist/release
              package=$(find /work/dist/release -name "*.deb" -print -quit)
              dpkg-deb --info "$package"
              dpkg-deb --contents "$package"
              extract=$(mktemp -d /tmp/ppm-deb-check.XXXXXX)
              dpkg-deb --extract "$package" "$extract"
              test -x "$extract/usr/lib/panasonic-posture-manager/relay"
              test -f "$extract/usr/lib/python3/dist-packages/panasonic_posture/__init__.py"
              test -f "$extract/usr/share/panasonic-posture-manager/ui/main.js"
              grep -q "^ExecStart=/usr/bin/python3 " \
                "$extract/usr/lib/systemd/system/panasonic-posture-manager.service"
              grep -q "^ExecStart=/usr/bin/python3 " \
                "$extract/usr/lib/systemd/user/panasonic-posture-manager-session.service"
              PYTHONPATH="$extract/usr/lib/python3/dist-packages" \
                PANASONIC_POSTURE_UI_DIR="$extract/usr/share/panasonic-posture-manager/ui" \
                python3 -c "import panasonic_posture; assert panasonic_posture.__version__ == \"$RELEASE_TAG\".removeprefix(\"v\")"
            '

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/release/*.deb
          if-no-files-found: error
          retention-days: 7

  package-rpm:
    name: Fedora RPM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build and inspect .rpm
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e RELEASE_TAG \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            fedora:latest \
            bash -lc '
              set -euo pipefail
              dnf install -y --setopt=install_weak_deps=False \
                gcc gettext git gzip make python3-build python3-devel \
                python3-installer python3-setuptools python3-wheel rpm-build tar
              git config --global --add safe.directory /work
              python3 packaging/scripts/release_version.py --tag "$RELEASE_TAG"
              bash packaging/scripts/build-rpm.sh /work/dist/release
              package=$(find /work/dist/release -name "*.rpm" -print -quit)
              rpm -qip "$package"
              rpm -qlp "$package"
              expected_version="${RELEASE_TAG#v}-1"
              test "$(rpm -qp --qf "%{VERSION}-%{RELEASE}" "$package")" = "$expected_version"
              rpm -qlp "$package" | grep -qx /usr/lib/panasonic-posture-manager/relay
              rpm -qlp "$package" | grep -q "^/usr/lib/python3\.[0-9]*/site-packages/panasonic_posture/__init__\.py$"
              rpm -qlp "$package" | grep -qx /usr/lib/systemd/user/panasonic-posture-manager-session.service
            '

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/release/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs:
      - package-arch
      - package-deb
      - package-rpm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          files=(*.deb *.rpm *.pkg.tar.zst)
          if [ "${#files[@]}" -ne 3 ]; then
            echo "error: expected three package files, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "Panasonic Posture Manager $TAG" \
              --generate-notes
          fi

  aur:
    name: Publish AUR package
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download validated AUR metadata
        uses: actions/download-artifact@v4
        with:
          name: aur-metadata
          path: aur-metadata

      - name: Push AUR metadata
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          bash packaging/scripts/publish-aur.sh aur-metadata
